[project]
name = "viddhi-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135,<0.136",
    "opendataloader-pdf>=2.2,<3.0",
    "neo4j>=5.28,<6.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "langgraph>=1.1,<2.0",
    "langchain-google-genai>=4.2,<5.0",
    "langsmith>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.4",
    "pytest-asyncio>=1.0,<2.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "graph*", "query*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (require real PDFs and Java 11+)",
    "integration: marks tests requiring live Neo4j and Gemini API",
]

[tool.ruff]
target-version = "py312"
line-length = 120
